name: Collect Headlines & Precompute Digest (Schedule)

# ① 매체 1면 헤드라인·인기기사를 매시간 관측해 NewsHeadline 테이블에 쌓고,
# ② 그것을 반영한 "오늘의 시그널" 패널을 미리 계산해 둔다(순서가 중요하다).
#
# 왜 GitHub Actions인가: FierceBiotech가 Cloudflare 봇 차단으로 Vercel 서버리스에서
# 403이 난다(데이터센터 IP 평판 문제. UA는 이미 Chrome이고, UA만으로는 풀리지 않는다).
# probe-sources 워크플로로 확인해 보니 GitHub 러너에서는 200이라 긁는 주체만 옮겼다.
#
# 왜 쌓아 두는가: 매체 홈페이지는 "지금 이 순간" 1면만 보여준다. 쌓아 두지 않으면
# 어제 1면을 휩쓴 사안이 오늘 신호 0이 된다(2026-09-08 노바티스 건).
#
# 왜 매시간인가(2026-09-10에 2시간 → 1시간): GitHub 스케줄은 실제로 24~74분씩 밀린다.
# 2시간 간격에서는 09:07 예정이 74분 밀려 10:20까지 07:07 데이터를 보게 됐다 —
# 국내 AI 매체 기사가 08~11시에 몰리는데 그 시간대를 통째로 놓친 것이다.
# 지연 자체는 우리가 못 고치므로 간격을 좁혀 영향을 줄인다.
#
# 비용을 재고 결정했다. 중요도·엔티티·요약은 전부 URL 단위로 캐시되므로(각각
# 1,000건 이상 적재) 재실행에 재과금되지 않고, 실행마다 반드시 새로 부르는 것은
# 사건 병합 6회(도메인 2 × 기간 3)뿐이다 — 실행당 약 5만 입력 토큰, gpt-4o-mini
# 기준 $0.007이다. 매시간이면 월 $5 수준이고, 저장소가 public이라 Actions 러너
# 시간은 무료다.
#
# 다이제스트 발송 시각(월·수·금 09:00 KST)은 그대로 둔다. 매시간으로 바꿔도 직전
# 실행은 08:07이라 메일은 여전히 한 시간 전 데이터를 쓰는데, 메일은 "이번 주 트렌드"
# 라 마지막 한 시간이 빠지는 것이 치명적이지 않다. 발송을 미뤄 GitHub 지연에
# 걸어 두는 것보다 낫다고 봤다(2026-09-10 결정).
#
# 사전계산을 붙인 이유: 패널이 요청마다 전부 새로 만들고 있었고 캐시가 찬 상태에서도
# 12.5초가 걸렸다(RSS 25곳 + 중요도 채점 + 사건 병합 + 요약 + 포폴 매칭).
# 대시보드 AI 요약과 같은 패턴으로 미리 계산해 두고 화면은 읽기만 한다(CLAUDE.md).
#
# CLAUDE.md 규칙: 같은 작업을 Vercel과 GitHub Actions 양쪽에 만들지 않는다 —
# vercel.json의 collect-social에서 헤드라인 관측을 빼고 이 워크플로 하나로 뒀다.
on:
  schedule:
    - cron: '7 * * * *'  # 매시간. 정각은 GitHub 전역 혼잡으로 더 밀려서 7분에 둔다.
  workflow_dispatch:

# 매시간 돌면서 지연이 겹칠 수 있다 — 74분 밀린 실행이 다음 실행과 만나면 같은
# 테이블에 동시에 쓴다. 앞선 실행을 취소하고 새 것만 남긴다(최신 데이터가 목적이므로
# 뒤늦게 끝나는 옛 실행을 살릴 이유가 없다).
concurrency:
  group: collect-headlines
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Collect headlines
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: npx tsx scripts/collect-headlines.ts

      # 헤드라인 관측 다음에 돌려야 방금 관측한 1면이 이번 계산에 반영된다.
      - name: Precompute digest panel
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/precompute-digest.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ 헤드라인 관측 실패 $(date '+%Y-%m-%d %H:%M:%S')"
          echo "매체 마크업 변경 또는 접근 차단일 수 있습니다. 위 로그를 확인하세요."
