name: Daily Collect (Schedule)

# 매일 오전 6시 13분 KST (UTC 21:13 전날) 실행
# 뉴스 수집 → 분석 → DB 저장 (발송 제외)
#
# 2026-07-28 포트폴리오사 수집 캡 제거(9dadab6) 이후 전체 수집에 최대 1시간 가까이
# 걸리게 되어, Vercel 함수 실행시간 제한(maxDuration=300초)에 걸려 매번 중간에
# 강제 종료되고 RunLog가 RUNNING 상태로 멈추는 문제가 있었음. GitHub Actions는
# 시간제한이 넉넉해서(기본 6시간/작업), Vercel API를 curl로 호출하는 대신
# scripts/run-digest.ts를 이 워크플로 안에서 직접 실행하도록 변경.
#
# 2026-08-05: 정각(0분)에 예약된 크론은 GitHub 전역에서 같은 시각에 몰려 매일
# ~1시간씩 지연되는 걸 GitHub Actions API로 확인(run_started_at 자체가 늦게 찍힘,
# 대기열 지연이 아니라 스케줄러가 애초에 늦게 만듦). GitHub 공식 문서도 정각 스케줄은
# 지연되기 쉽다고 안내함 — 정각을 피해 22:07로 이동.
#
# 2026-08-06: 07:07(=UTC 22:07)로 옮겼는데도 실제로는 08:14 KST에 시작해 09:08 KST에
# 끝남(67분 지연 + 55분 실행) — 발송 크론(월수금 09:00 KST, vercel.json)이 돌 때
# 수집이 아직 안 끝났을 위험이 있었음. 분(分) 선택보다 "지연이 나도 9시 전에 끝나게
# 여유를 두는 것"이 실질적 해법이라, 06:13 KST(UTC 21:13)로 더 당김. 기사 발행량이
# 06~11시에 집중되므로(특히 08~10시가 최고조) 너무 이르게(예: 새벽 4시) 당기면 그
# 몰린 물량을 놓치게 돼 이 정도가 절충선.
on:
  schedule:
    - cron: '13 21 * * *'  # UTC 21:13 = KST 06:13 (매일) — 9시 발송 전 완료 여유 확보
  workflow_dispatch:  # 수동 트리거

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run collection (수집 + 분석 + DB 저장, 발송 안 함)
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "📰 Starting daily collection at $(date '+%Y-%m-%d %H:%M:%S')"
          npm run digest:run

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Daily collection failed at $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Check the logs above for details"
