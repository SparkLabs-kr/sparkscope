name: Daily Collect (Schedule)

# 매일 오전 6시 13분 KST (UTC 21:13 전날) 실행
# 뉴스 수집 → 분석 → DB 저장 (발송 제외)
#
# 2026-07-28 포트폴리오사 수집 캡 제거(9dadab6) 이후 전체 수집에 최대 1시간 가까이
# 걸리게 되어, Vercel 함수 실행시간 제한(maxDuration=300초)에 걸려 매번 중간에
# 강제 종료되고 RunLog가 RUNNING 상태로 멈추는 문제가 있었음. GitHub Actions는
# 시간제한이 넉넉해서(기본 6시간/작업), Vercel API를 curl로 호출하는 대신
# scripts/run-digest.ts를 이 워크플로 안에서 직접 실행하도록 변경.
#
# 2026-08-05: 정각(0분)에 예약된 크론은 GitHub 전역에서 같은 시각에 몰려 매일
# ~1시간씩 지연되는 걸 GitHub Actions API로 확인(run_started_at 자체가 늦게 찍힘,
# 대기열 지연이 아니라 스케줄러가 애초에 늦게 만듦). GitHub 공식 문서도 정각 스케줄은
# 지연되기 쉽다고 안내함 — 정각을 피해 22:07로 이동.
#
# 2026-08-06: 07:07(=UTC 22:07)로 옮겼는데도 실제로는 08:14 KST에 시작해 09:08 KST에
# 끝남(67분 지연 + 55분 실행) — 발송 크론(월수금 09:00 KST, vercel.json)이 돌 때
# 수집이 아직 안 끝났을 위험이 있었음. 분(分) 선택보다 "지연이 나도 9시 전에 끝나게
# 여유를 두는 것"이 실질적 해법이라, 06:13 KST(UTC 21:13)로 더 당김. 기사 발행량이
# 06~11시에 집중되므로(특히 08~10시가 최고조) 너무 이르게(예: 새벽 4시) 당기면 그
# 몰린 물량을 놓치게 돼 이 정도가 절충선.
#
# 2026-09-29: 그래도 9/11~9/28 실측 시작 08:03~09:06(2~3시간 지연) — 분 조정으로는 안 된다.
# 이제 Vercel 크론(vercel.json, 05:50 KST)이 /api/cron/dispatch로 workflow_dispatch를 걸어
# 제시각에 시작시킨다(07:00~07:50 완료 → 9시 브리핑). 아래 schedule은 토큰이 빠졌거나 요청이
# 실패한 날을 위한 예비이고, 이미 수집이 돌았으면 첫 단계(collect-guard)에서 건너뛴다.
on:
  schedule:
    - cron: '13 21 * * *'  # 예비 — UTC 21:13 = KST 06:13 (실제로는 2~3시간 늦게 돈다)
  workflow_dispatch:  # Vercel 크론(05:50 KST)이 여기로 시작시킨다 + 수동 트리거

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ran: ${{ steps.guard.outputs.skip != 'true' }}
      dow: ${{ steps.dow.outputs.dow }}

    steps:
      - name: KST weekday (1=월 … 7=일)
        id: dow
        run: echo "dow=$(TZ=Asia/Seoul date +%u)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Inter(해외 트렌드) 기사 분류는 Vertex AI(Gemini)를 쓰는데, 그 인증은 서비스 계정
      # 키 "파일"의 경로(GOOGLE_APPLICATION_CREDENTIALS)를 읽는 방식이다. 저장소에는 키 파일을
      # 둘 수 없으므로(.gitignore) 시크릿에 JSON 내용을 넣어두고 실행할 때만 파일로 푼다.
      #   2026-08-07까지 이 단계가 아예 없어서 크론이 도는 동안 Vertex 인증이 계속 실패했고,
      #   inter-filter.ts가 그 예외를 삼켜 기사를 전부 "필터링 오류"=노이즈로 저장했다.
      #   화면상 해외 기사가 안 늘고 국가 탭(중국/일본/사우디)이 비어 보이던 원인.
      # echo 대신 printf를 쓰는 건 private_key의 \n이 깨지지 않게 하기 위함.
      # 예비 schedule 실행만 판단한다 — 05:50 dispatch 수집이 이미 돌았으면 건너뛴다.
      - name: Skip if already collected today (예비 schedule 실행일 때만)
        id: guard
        if: github.event_name == 'schedule'
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: npx tsx scripts/collect-guard.ts

      - name: Write GCP credentials
        if: steps.guard.outputs.skip != 'true'
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GCP_SA" > "$RUNNER_TEMP/gcp-sa.json"

      - name: Run collection (수집 + 분석 + DB 저장, 발송 안 함)
        if: steps.guard.outputs.skip != 'true'
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
        run: |
          echo "📰 Starting daily collection at $(date '+%Y-%m-%d %H:%M:%S')"
          npm run digest:run

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Daily collection failed at $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Check the logs above for details"

  # 예비 경로 — 토큰(GITHUB_DISPATCH_TOKEN)이 없어 10:32 Vercel dispatch가 안 되는 날에도 브리핑이 나가게,
  # 예비 schedule 수집이 실제로 돈 월·수·금에는 이어서 브리핑 워크플로를 부른다(메일 10:30까지 대기).
  # 05:50 dispatch 수집이 돈 날은 여기서 부르지 않는다(3시간 넘게 기다리게 되므로) — 그날은 10:32 dispatch 담당.
  briefing:
    needs: collect
    if: github.event_name == 'schedule' && needs.collect.outputs.ran == 'true' && contains(fromJSON('["1","3","5"]'), needs.collect.outputs.dow)
    uses: ./.github/workflows/daily-briefing.yml
    secrets: inherit
