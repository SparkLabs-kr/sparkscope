name: Daily Briefing Video

# 월·수·금 브리핑 영상 — 월요일은 위클리(Claw-e 뉴스데스크), 수·금은 데일리(그날 09:30 메일을 영상으로).
# 헤드라인 스냅샷 → 대본 → 음성 → 슬라이드 → MP4 → Supabase Storage. 어느 쪽인지는 briefing.ts broadcastFor()가 정한다.
# 영상 렌더링(ffmpeg)은 Vercel 함수로 돌리기 무거워 여기서 한다.
#
# 시작 경로(오늘 영상이 이미 있으면 wait-for-briefing이 건너뛰어 두 번 만들지 않는다):
#  - Vercel 크론(vercel.json) 월 08:30 · 수·금 09:32 KST → /api/cron/dispatch (GITHUB_DISPATCH_TOKEN 필요)
#  - 예비: daily-collect.yml 수집이 끝난 뒤 이어서 호출(workflow_call) — 토큰이 없어도 돈다
# 재료를 기다린다(월: 오늘 수집 · 마감 09:25 / 수·금: 메일 발송 · 마감 10:05). 게시 후 09:45 Vercel 크론이 잔디로 보낸다.
on:
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 영상이 이미 있어도 다시 만들기'
        type: boolean
        default: false
  workflow_call:

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/../gcp-sa.json
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate

      # 음성(Google Cloud TTS)·Inter 분류와 같은 서비스 계정. printf — private_key의 \n이 깨지지 않게.
      - name: Write GCP credentials
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GCP_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Wait for today's material (Mon collect, Wed/Fri mail)
        id: wait
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: npx tsx scripts/wait-for-briefing.ts

      # --prepare 없음 — 수·금은 메일 발송이 만든 스냅샷을 그대로 쓴다(월요일·없을 때는 새로 만든다).
      - name: Build & publish briefing video
        if: steps.wait.outputs.skip != 'true'
        run: npx tsx scripts/build-briefing.ts --publish --out out/briefing

      # 실패해도 영상 파일은 남겨 원인을 볼 수 있게
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-video
          path: out/briefing/*.mp4
          retention-days: 7
          if-no-files-found: ignore
