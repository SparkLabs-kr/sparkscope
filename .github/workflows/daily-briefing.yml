name: Daily Briefing Video

# 월·수·금 데일리 브리핑 영상 — 헤드라인 확정 → 대본 → 음성 → 슬라이드 → MP4 → Supabase Storage.
# Vercel 크론(vercel.json, 월·수·금 08:25 KST)이 /api/cron/dispatch로 시작시킨다.
# GitHub schedule은 2~3시간씩 늦게 돌아서 쓰지 않는다(daily-collect.yml 머리말 참고).
# 영상 렌더링(ffmpeg)은 Vercel 함수로 돌리기 무거워 여기서 한다.
#
# 수집이 아직 끝나지 않았으면 끝날 때까지 기다린다(마감 09:05 KST — 그 뒤엔 있는 데이터로 만든다).
# 게시 후 09:00 Vercel 크론(/api/cron/briefing-notify)이 잔디로 링크를 보낸다.
on:
  workflow_dispatch:

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/../gcp-sa.json
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate

      # 음성(Google Cloud TTS)·Inter 분류와 같은 서비스 계정. printf — private_key의 \n이 깨지지 않게.
      - name: Write GCP credentials
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GCP_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Wait for today's collection
        run: npx tsx scripts/wait-for-collect.ts

      - name: Build & publish briefing video
        run: npx tsx scripts/build-briefing.ts --prepare --publish --out out/briefing

      # 실패해도 영상 파일은 남겨 원인을 볼 수 있게
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-video
          path: out/briefing/*.mp4
          retention-days: 7
          if-no-files-found: ignore
